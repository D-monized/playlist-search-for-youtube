<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 420px; margin: 0; font: 13px system-ui, sans-serif; }
  input { box-sizing: border-box; width: 100%; padding: 10px; border: 0; border-bottom: 1px solid #ccc; font-size: 15px; outline: none; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 480px; overflow-y: auto; }
  li a { display: block; padding: 8px 10px; color: inherit; text-decoration: none; border-bottom: 1px solid #eee; }
  li a:hover, li a:focus { background: #f2f2f2; outline: none; }
  .meta { color: #666; font-size: 11px; margin-top: 2px; }
  .tag { background: #e8e8e8; border-radius: 3px; padding: 0 4px; margin-right: 4px; }
  .empty { padding: 12px 10px; color: #666; }
</style>
</head>
<body>
  <input id="q" type="search" placeholder="Search YouTube history & bookmarks…" aria-label="Search YouTube history and bookmarks" autofocus>
  <ul id="results"></ul>
  <script src="results.js"></script>
  <script src="popup.js"></script>
</body>
</html>
